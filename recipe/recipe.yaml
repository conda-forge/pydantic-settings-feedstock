schema_version: 1

context:
  name: pydantic-settings
  version: 2.16.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pydantic_settings-${{ version }}.tar.gz
  sha256: 5b6c578049ede4db0e2ef3b4eaa4ad4069cfa9211f83fb38df899dfade50a614

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - typing-inspection >=0.4.0
    - python >=${{ python_min }}
    - pydantic >=2.7.0
    - python-dotenv >=1.2.2
    - typing_extensions >=4.0.0
tests:
  - python:
      imports:
        - pydantic_settings
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Settings management using Pydantic
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pydantic/pydantic-settings
  repository: https://github.com/pydantic/pydantic-settings
  documentation: https://docs.pydantic.dev/latest/usage/pydantic_settings/

extra:
  recipe-maintainers:
    - jan-janssen
    - fhoehle
